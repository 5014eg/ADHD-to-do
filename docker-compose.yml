services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount the current directory to /app in the container
      # This enables Hot Reloading: changes on Windows are reflected in the container
      - .:/app
      # Keep node_modules inside the container separate from the host
      # This prevents Windows/Linux binary incompatibilities
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Often needed for hot reload to work correctly on Windows
      - WATCHPACK_POLLING=true
    stdin_open: true # Needed for interactive mode
    tty: true
